; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Build + upload to the board:   pio run -e cultivator -t upload
; Run the laptop unit tests:      pio test -e native
;
; src/main.cpp is the single Arduino setup()/loop() entry point; it calls into
; both src/cultivator/ (grow-light control) and src/sign-on/ (eduroam WiFi),
; which expose cultivatorSetup()/cultivatorLoop() and signOnSetup()/signOnLoop()
; instead of their own setup()/loop(), plus src/telemetry/ (telemetrySetup()/
; telemetryLoop()). All of them get built together below.

[platformio]
default_envs = cultivator

[env:cultivator]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
lib_deps =
    adafruit/RTClib @ ^2.1.4

; Unit tests for the pure (no-Arduino) logic, run on your computer — no board
; needed. Tests live in test/. Needs a C++ compiler (Xcode tools / MinGW / gcc).
[env:native]
platform = native
test_build_src = no
