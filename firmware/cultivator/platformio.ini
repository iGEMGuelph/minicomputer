; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; src/main.cpp is the single Arduino setup()/loop() entry point; it calls into
; src/cultivator/ (grow-light control), src/sign-on/ (WiFi), src/api/ (incoming
; /api/status) and src/backend/ (outbound calls to the dashboard backend), which
; each expose a xxxSetup()/xxxLoop() pair instead of their own setup()/loop().
; All of them get built together below.

[env:cultivator]
platform = ststm32
board = giga_r1_m7
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/RTClib @ ^2.1.4
    bblanchon/ArduinoJson @ ^7.2.0
