; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; src/main.cpp is the single Arduino setup()/loop() entry point; it calls into
; src/cultivator/ (grow-light control), src/sign-on/ (WiFi) and src/remote/
; (dashboard polling), which expose xxxSetup()/xxxLoop() pairs instead of their
; own setup()/loop(). All of them get built together below.

[env:cultivator]
; Pinned on purpose: the code uses the arduino-esp32 2.x LEDC API, removed in 3.x.
platform = espressif32@7.0.1
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
; The Nano ESP32's native upload path. esptool fails on this board with
; "Errno 71 Protocol error" (its USB re-enumerates during the DTR reset).
upload_protocol = dfu
lib_deps =
    adafruit/RTClib @ ^2.1.4
    bblanchon/ArduinoJson @ ^7.2.0
